<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>歴史探偵アナライザー</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- App -->
    <script src="app.js" defer></script>
</head>

<body>

    <div id="app">

        <!-- スタート画面 -->
        <main id="start-screen" class="screen screen-active">

            <section class="start-shell">

                <div class="brand-badge">
                    北辰テスト対策・歴史の流れ演習
                </div>

                <div class="hero-card">

                    <div class="hero-content">

                        <p class="eyebrow">
                            HISTORY DETECTIVE ANALYZER
                        </p>

                        <h1 class="hero-title">
                            歴史探偵<br>
                            アナライザー
                        </h1>

                        <p class="hero-subtitle">
                            暗記を捨てて、流れを掴め。
                        </p>

                        <p class="hero-description">
                            原因・経過・結果をドラッグ＆ドロップで整理し、
                            歴史の因果関係を探る学習アプリです。
                        </p>

                        <form id="start-form">

                            <label for="team-name" class="input-label">
                                チーム名
                            </label>

                            <input id="team-name" class="team-input" type="text" maxlength="20" placeholder="例：ペア1、Aチーム"
                                required>

                            <button type="submit" class="primary-button">
                                調査開始
                            </button>

                        </form>

                    </div>

                </div>

            </section>

        </main>

        <!-- 問題画面 -->
        <section id="work-screen" class="screen">

            <div class="work-shell">

                <header class="work-header">

                    <div>

                        <p>
                            問
                            <span id="question-progress">
                                1 / 4
                            </span>
                        </p>

                        <p>
                            Team :
                            <span id="team-display">
                                未設定
                            </span>
                        </p>

                    </div>

                </header>

                <article class="question-panel">

                    <p>
                        <span id="era-label">
                            古代〜中世
                        </span>
                    </p>

                    <h2 id="theme-title">
                        土地と政治の変化
                    </h2>

                    <button id="hint-button" type="button">
                        教科書ヒント
                    </button>

                    <ul id="sortable-cards"></ul>

                    <button id="judge-button" type="button" class="primary-button">
                        答える
                    </button>

                </article>

            </div>

        </section>

        <!-- 結果モーダル -->
        <div id="result-modal" class="modal" aria-hidden="true">

            <div class="modal-backdrop"></div>

            <div class="modal-panel">

                <div id="result-icon">
                    ✓
                </div>

                <h2 id="result-title">
                    判定結果
                </h2>

                <p id="result-message"></p>

                <img id="explanation-image" class="explanation-image" alt="歴史資料画像">

                <div class="explanation-box">

                    <h3>
                        解説
                    </h3>

                    <p id="explanation-text"></p>

                </div>

                <div class="modal-actions">

                    <button id="retry-button" type="button" class="secondary-button">
                        もう一度調査する
                    </button>

                    <button id="next-button" type="button" class="primary-button">
                        次の問題へ
                    </button>

                </div>

            </div>

        </div>

        <!-- ヒントモーダル -->
        <div id="hint-modal" class="modal" aria-hidden="true">

            <div class="modal-backdrop"></div>

            <div class="modal-panel">

                <h2>
                    教科書を開け！
                </h2>

                <p id="hint-text"></p>

                <button id="close-hint-button" type="button" class="primary-button">
                    わかった
                </button>

            </div>

        </div>

        <!-- 完了画面 -->
        <section id="complete-screen" class="screen">

            <div class="complete-shell">

                <div class="complete-card">

                    <h2>
                        全問正解！
                    </h2>



                    <button id="restart-button" type="button" class="primary-button">
                        最初から始める
                    </button>

                </div>

            </div>

        </section>

    </div>

</body>

</html>
